<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달력</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
  <div><h1>달력</h1><p>업무 일정과 수업시간표 입력</p></div>
    <nav><a href="index.html">메인</a><a class="active" href="calendar.html">달력</a><a href="reservation.html">예약</a><a href="index.html#info">정보</a><a href="settings.html">설정</a></nav>
  </header>

  <main class="layout">
    <section class="toolbar card">
      <button id="prevWeek">이전 주</button>
      <input id="weekPicker" type="date" />
      <button id="nextWeek">다음 주</button>
      <button id="addEventBtn">업무 일정 추가</button>
    </section>

    <section class="card scroll-card">
      <div id="calendarGrid" class="week-grid"></div>
    </section>
  </main>

  <dialog id="lessonDialog" class="quick-dialog">
    <div id="lessonSubjectButtons" class="subject-button-grid" aria-label="과목 선택"></div>
  </dialog>

  <dialog id="memoDialog" class="quick-dialog">
    <textarea id="memoText" class="memo-editor" placeholder="메모를 입력하세요."></textarea>
  </dialog>

  <dialog id="eventDialog">
    <form method="dialog" id="eventForm" class="grid-form dialog-form">
      <h2>업무 일정</h2>
      <input name="title" placeholder="일정명" required />
      <input name="event_date" type="date" required />
      <div class="event-period-buttons" role="group" aria-label="업무 일정 위치">
        <button type="button" data-event-period="0">아침</button>
        <button type="button" data-event-period="1">1교시</button>
        <button type="button" data-event-period="2">2교시</button>
        <button type="button" data-event-period="3">3교시</button>
        <button type="button" data-event-period="4">4교시</button>
        <button type="button" data-event-period="5">5교시</button>
        <button type="button" data-event-period="6">6교시</button>
        <button type="button" data-event-period="7" class="active">방과후</button>
      </div>
      <input name="period" type="hidden" value="7" />
      <input name="event_time" type="time" />
      <input name="place" placeholder="장소" />
      <textarea name="content" placeholder="내용"></textarea>
      <menu><button value="cancel" type="button" id="closeDialog">취소</button><button value="default">저장</button></menu>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
