<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학년 공유</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>학년 공유</h1>
    </div>
    <nav>
      <button data-page="main" class="active">메인</button>
      <a href="calendar.html">달력</a>
      <a href="reservation.html">예약</a>
      <button data-page="info">정보</button>
      <a href="settings.html">설정</a>
    </nav>
  </header>

  <main>
    <section id="main" class="page active grid-main">
      <div class="left-col">
        <details class="card">
          <summary>기본정보</summary>
          <table id="classInfoTable"></table>
        </details>

        <section class="card">
          <div class="section-header">
            <h2>공지사항</h2>
            <button id="showNoticeFormBtn" type="button">추가</button>
          </div>
          <div id="noticeList" class="list"></div>
          <dialog id="noticeDialog">
            <form id="noticeForm" class="form-grid dialog-form">
              <h3 class="full-field notice-dialog-title">공지사항 추가</h3>
              <input name="title" placeholder="제목" required />
              <input name="place" placeholder="장소" />
              <div class="notice-date-time full-field">
                <label>날짜 <input name="date" type="date" /></label>
                <label>시간 <input name="time" type="time" /></label>
              </div>
              <textarea name="content" placeholder="내용"></textarea>
              <label class="notice-checklist-option full-field"><input name="checklist" type="checkbox" /> 체크리스트</label>
              <menu>
                <button id="closeNoticeDialogBtn" class="secondary" type="button">취소</button>
                <button class="notice-submit-button" type="submit">공지 추가</button>
              </menu>
            </form>
          </dialog>
        </section>
      </div>

      <aside class="right-col">
        <section class="card today-card">
          <h2>오늘의 업무일정</h2>
          <div id="todayWorkList" class="list compact"></div>
        </section>
        <section class="card today-card">
          <h2>오늘의 수업시간표</h2>
          <div id="todayTimetable"></div>
        </section>
      </aside>
    </section>

    <section id="reservation" class="page">
      <section class="card">
        <h2>예약</h2>
        <form id="resourceForm" class="inline-form">
          <input name="name" placeholder="장소/물건 이름 예: 음악실, 지구본" required />
          <button>등록</button>
        </form>
        <form id="reservationForm" class="form-grid">
          <select name="resourceId" required></select>
          <input name="date" type="date" required />
          <select name="period" required></select>
          <input name="teacher" placeholder="예약자" required />
          <input name="memo" placeholder="메모" />
          <button>예약 추가</button>
        </form>
        <div id="reservationList" class="list"></div>
      </section>
    </section>

    <section id="info" class="page">
      <section class="card">
        <div class="section-header">
          <h2>정보</h2>
          <button id="showInfoFormBtn" type="button">추가</button>
        </div>
        <div id="infoList" class="list"></div>
        <dialog id="infoDialog">
          <form id="infoForm" class="form-grid dialog-form">
            <h3 class="full-field info-dialog-title">정보 추가</h3>
            <input name="title" placeholder="제목" required />
            <input name="url" placeholder="링크 URL 또는 비워두기" />
            <textarea name="content" placeholder="공유할 정보, 절차, 계정 안내 등"></textarea>
            <menu>
              <button id="closeInfoDialogBtn" class="secondary" type="button">취소</button>
              <button class="info-submit-button" type="submit">정보 추가</button>
            </menu>
          </form>
        </dialog>
      </section>
    </section>

    <section id="settings" class="page">
      <section class="card">
        <h2>설정</h2>
        <div class="settings-grid">
          <label>학급 수 <input id="classCount" type="number" min="1" max="12" /></label>
          <label>교시 수 <input id="periodCount" type="number" min="1" max="9" /></label>
        </div>
        <h3>수업 코드/색</h3>
        <form id="subjectForm" class="inline-form">
          <input name="code" placeholder="예: E, 과2, 국L" required />
          <input name="name" placeholder="과목 이름" required />
          <input name="color" type="color" value="#dbeafe" />
          <label><input name="exclusive" type="checkbox" /> 겹치면 안 됨</label>
          <button>추가</button>
        </form>
        <div id="subjectList" class="chip-list"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
